# Los bindings de teclado y raton siguen perteneciendo al cliente original.
# Se cambian desde Options > Controls dentro de Spiral Knights. El servidor
# recibe el resultado normalizado (direccion, rotacion y flags de acciones).

# Habilita el procesamiento de InputFrame.
movement.enabled=true

# Envia ActorDelta al cliente y confirma los frames procesados.
movement.sendAuthoritativeUpdates=true

# Velocidad efectiva = baseSpeed * speedMultiplier.
# Character/PC/Default y Character/PC/Level declaran speed=5.0 en actor.dat.
# Mantener esta base igual al actor evita que la prediccion local y el estado
# autoritativo se corrijan mutuamente en cada SceneDeltaEvent.
movement.baseSpeed=5.0
movement.speedMultiplier=1.0

# Protecciones contra paquetes atrasados o manipulados.
movement.maxFrameDeltaMs=250
movement.maxFramesPerPacket=64

# Tick base autoritativo compartido por todos los jugadores de Haven.
# TudeySceneConfig.CP() devuelve 100 ms en la JAR instalada: 10 Hz coincide
# con la cadencia a la que el cliente envia InputEnqueueEvent.
# Cada tick se encadena contra el timestamp enviado inmediatamente anterior.
# El ACK informa consumo del cliente, pero no bloquea el siguiente tick.
movement.deltaIntervalMs=100

# Training Hall usa el mismo reloj real, pero agrupa dos pasos de input en un
# SceneDeltaEvent fiable de 200 ms. El cliente grafico procesa cerca de cinco
# records por segundo con Dungeoneer; enviar diez acumula ACK aun sin ActorDelta.
movement.trainingDeltaIntervalMs=200

# La prediccion local anima el pawn entre snapshots. En Haven el reloj sale a
# 10 Hz y posiciones/rotaciones autoritativas se reconcilian a 5 Hz. Training
# ya emite sus records completos a 5 Hz. Inicio/fin de movimiento, ataques,
# defensa, esquiva y cambios de arma salen en el siguiente tick de su escena.
movement.actorStateIntervalMs=200

# Limites exteriores del SceneModel de Haven. No sustituyen aun la colision
# detallada con paredes/objetos del mapa.
movement.clampToMapBounds=true
movement.bounds.minX=-81.0
movement.bounds.maxX=86.0
movement.bounds.minY=-82.0
movement.bounds.maxY=70.0

# 0 desactiva el log periodico. 20 suele equivaler aproximadamente a 1 segundo.
movement.logEveryPackets=20
